[project]
name = "pramaan-worker"
version = "0.1.0"
description = "Dramatiq jobs: imaging, scans, parsing, analytics."
requires-python = ">=3.11"
dependencies = [
    "pramaan-core",
]

[tool.uv.sources]
pramaan-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pramaan_worker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"
