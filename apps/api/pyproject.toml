[project]
name = "pramaan-api"
version = "0.1.0"
description = "FastAPI app: routes, auth, WebSocket job progress."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "itsdangerous>=2.1,<3",
    "python-multipart>=0.0.9,<1",
    "argon2-cffi>=23,<26",
    "pramaan-core",
    "pramaan-custody",
    "pramaan-worker",
]

[tool.uv.sources]
pramaan-core = { workspace = true }
pramaan-custody = { workspace = true }
pramaan-worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pramaan_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# FastAPI's dependency-injection idiom is `param: T = Depends(get_t)` —
# these calls are intentionally re-evaluated per-request by FastAPI, not the
# "mutable default argument" bug B008 exists to catch.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
]

[tool.mypy]
strict = true
python_version = "3.11"
