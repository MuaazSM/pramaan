[package]
name = "pramaan-scanner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Disk-speed signature and NAL scans (mmap + aho-corasick + rayon), with a pure-Python fallback kept in packages/core."
publish = false

[lib]
name = "pramaan_scanner"
path = "src/lib.rs"
# cdylib so maturin can build the PyO3 extension module (feature "python");
# rlib so plain `cargo build`/`cargo test`/`cargo clippy` keep working with
# zero Python linkage when that feature is off (the default).
crate-type = ["rlib", "cdylib"]

# `python` is opt-in (not part of `default`) so `cargo build`/`test`/`clippy`
# never need libpython or maturin. It is enabled explicitly by
# `maturin develop --features python` (see `just setup`), which is the only
# path that builds the importable `pramaan_scanner` extension module.
[features]
default = []
python = ["dep:pyo3"]

[dependencies]
memmap2 = "0.9"
aho-corasick = "1"
rayon = "1"
pyo3 = { version = "0.22", optional = true, features = ["extension-module"] }
