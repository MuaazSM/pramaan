[project]
name = "pramaan"
version = "0.1.0"
description = "Pramaan — multi-vendor DVR/NVR forensic platform (workspace root)."
requires-python = ">=3.11"
dependencies = [
    "pramaan-core",
    "pramaan-formats",
    "pramaan-recovery",
    "pramaan-logs",
    "pramaan-timeline",
    "pramaan-analytics",
    "pramaan-custody",
    "pramaan-reporting",
    "pramaan-export",
    "pramaan-llm",
    "pramaan-api",
    "pramaan-worker",
    "pramaan-synthdvr",
    "pramaan-bindiff",
]

[tool.uv]
package = false

[tool.uv.sources]
pramaan-core = { workspace = true }
pramaan-formats = { workspace = true }
pramaan-recovery = { workspace = true }
pramaan-logs = { workspace = true }
pramaan-timeline = { workspace = true }
pramaan-analytics = { workspace = true }
pramaan-custody = { workspace = true }
pramaan-reporting = { workspace = true }
pramaan-export = { workspace = true }
pramaan-llm = { workspace = true }
pramaan-api = { workspace = true }
pramaan-worker = { workspace = true }
pramaan-synthdvr = { workspace = true }
pramaan-bindiff = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/*",
    "apps/api",
    "apps/worker",
    "tools/synthdvr",
    "tools/bindiff",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "httpx>=0.27,<1",
    "jsonschema>=4.21,<5",
    "maturin>=1.15.0",
    "types-pyyaml>=6.0,<7",
]

# Heavy ML/CV dependencies (torch, paddleocr, ultralytics, opencv-contrib, ...)
# must never land in the default dependency set on this dev machine (macOS
# arm64, ~13 GiB free disk). Individual packages that need them (packages/analytics,
# packages/timeline OCR fallbacks) declare an optional extra that `just setup`
# does NOT install by default. See docs/progress/W0.1.md "Decisions".

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["packages/formats/pramaan_formats/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = [
    "slow: corpus-scale tests, excluded from `just check` by default",
    "live: tests that hit the network or a live LLM; never run in `just check`",
]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"
exclude = ["packages/formats/pramaan_formats/generated"]

# pyarrow ships no py.typed marker / stubs as of the pinned version; pyewf
# (optional E01 dependency, docs/01-FORENSIC-CORE.md §4.1/§6) has no stubs
# either and is only ever imported inside a try/except ImportError guard.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "pyewf.*"]
ignore_missing_imports = true

# pramaan_scanner (crates/scanner, C1) is a compiled PyO3 extension with no
# stub package; it's optional at runtime (pramaan_core.scan falls back to
# pure Python when it isn't built) and only ever imported lazily inside a
# try/except ImportError guard in pramaan_core/scan.py.
[[tool.mypy.overrides]]
module = ["pramaan_scanner.*"]
ignore_missing_imports = true

# pytesseract ships no py.typed marker / stubs. paddleocr / rapidocr_onnxruntime
# are optional OCR engines (docs/03-AI-TIMELINE.md §4, packages/timeline) that
# are not installed by `just setup` (see the "Heavy ML/CV dependencies" note
# above) and are only ever imported lazily inside a try/except ImportError
# guard in packages/timeline/pramaan_timeline/osd.py.
[[tool.mypy.overrides]]
module = ["pytesseract.*", "paddleocr.*", "rapidocr_onnxruntime.*"]
ignore_missing_imports = true

# dramatiq ships no py.typed marker / stubs. Used by apps/worker's
# JOB_BACKEND=dramatiq path (docs/02-BACKEND.md §3, task B1).
[[tool.mypy.overrides]]
module = ["dramatiq.*"]
ignore_missing_imports = true

# weasyprint/playwright/pyhanko/pyhanko_certvalidator ship no py.typed
# marker / stubs (task B3, docs/02-BACKEND.md §9). weasyprint is imported
# lazily inside a try/except OSError/ImportError guard
# (packages/reporting/pramaan_reporting/pdf.py) so a missing native library
# never crashes report generation — it falls back to the Playwright/
# Chromium backend.
[[tool.mypy.overrides]]
module = ["weasyprint.*", "playwright.*", "pyhanko.*", "pyhanko_certvalidator.*"]
ignore_missing_imports = true

# pramaan_formats ships no py.typed marker either (packages/formats is
# CORE/C2's task, not B3's — adding one there caused unrelated
# "unused type: ignore" / return-type fallout in apps/worker's own registry
# module when trialled, so this task uses the same ignore_missing_imports
# treatment as the other untyped third-party deps above instead of editing
# a file outside its owned paths). packages/export/pramaan_export/mux.py
# only uses pramaan_formats.nalutil's NAL-splitting helpers.
[[tool.mypy.overrides]]
module = ["pramaan_formats.*"]
ignore_missing_imports = true
