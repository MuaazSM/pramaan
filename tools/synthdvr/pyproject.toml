[project]
name = "pramaan-synthdvr"
version = "0.1.0"
description = "Synthetic DVR disk image generator."
requires-python = ">=3.11"
dependencies = [
    "pillow>=10,<12",
    "pyarrow>=16,<19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pramaan_synthdvr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"
