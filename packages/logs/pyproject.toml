[project]
name = "pramaan-logs"
version = "0.1.0"
description = "Vendor log parsers."
requires-python = ">=3.11"
dependencies = [
    "pramaan-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pramaan_logs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"
