[project]
name = "pramaan-export"
version = "0.1.0"
description = "Signed MP4 export writer (stream copy, embedded + detached Ed25519 signature)."
requires-python = ">=3.11"
dependencies = [
    "pramaan-core",
    "pramaan-custody",
    "pramaan-formats",
]

[tool.uv.sources]
pramaan-core = { workspace = true }
pramaan-custody = { workspace = true }
pramaan-formats = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pramaan_export"]
artifacts = ["pramaan_export/py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"
