[project]
name = "pramaan-reporting"
version = "0.1.0"
description = "Report templates, BSA Section 63 certificate, PDF signing."
requires-python = ">=3.11"
dependencies = [
    "pramaan-core",
    "pramaan-custody",
    "jinja2>=3.1,<4",
    "cryptography>=42,<46",
    # PDF rendering: WeasyPrint is the primary backend (needs system pango/
    # cairo — see docs/02-BACKEND.md §9 / docs/progress/B3.md "Fallbacks
    # used"). Declared unconditionally; pramaan_reporting.pdf probes at
    # import time and falls back to Playwright's Chromium if WeasyPrint (or
    # its native libraries) can't load.
    "weasyprint>=62,<64",
    "playwright>=1.40,<2",
    # PAdES signing (docs/02-BACKEND.md §9 step 3).
    "pyhanko>=0.25,<1",
    "pyhanko-certvalidator>=0.26,<1",
]

[tool.uv.sources]
pramaan-core = { workspace = true }
pramaan-custody = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pramaan_reporting"]
# Jinja2 templates and bundled Geist font files live inside the package
# directory (pramaan_reporting/templates, pramaan_reporting/assets/fonts) —
# hatchling includes them by default via `packages`; py.typed marks this
# package as typed for downstream `mypy --strict` consumers (same fix as
# packages/custody's, docs/progress/B1.md).
artifacts = [
    "pramaan_reporting/templates/*.html",
    "pramaan_reporting/assets/fonts/*.woff2",
    "pramaan_reporting/py.typed",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"
# Note: the actual `mypy --strict` invocation used by `just check-backend`
# runs from the repo root, which reads root pyproject.toml's [tool.mypy]
# (mypy does not merge per-package pyproject.toml config when given
# multiple directory arguments) — the real ignore_missing_imports overrides
# for weasyprint/playwright/pyhanko live there.
